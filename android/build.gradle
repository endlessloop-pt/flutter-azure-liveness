group = "dev.endlessloop.flutter_azure_liveness"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
        classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
// Kotlin 2.0+ bundled Compose compiler — use the compose plugin instead of
// kotlinCompilerExtensionVersion.
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    namespace = "dev.endlessloop.flutter_azure_liveness"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")

        // Azure AI Vision Face Liveness UI SDK.
        //
        // The wrapper artifact below resolves from Maven Central (public), but its
        // mandatory transitive dependency `azure-ai-vision-face-ui-assets` (the native
        // libs + models) is NOT published there. It is vendored in `android/m2/` and the
        // consuming app must declare that directory as a Maven repository:
        //
        //   maven { url = uri("${project(":flutter_azure_liveness").projectDir}/m2") }
        //
        // Keep this version in lockstep with the vendored iOS xcframework.
        // See README "Vendored SDK binaries" for how to refresh both.
        implementation("com.azure:azure-ai-vision-face-ui:1.5.1")

        // Jetpack Compose (BOM keeps versions in sync)
        def composeBom = platform("androidx.compose:compose-bom:2024.10.00")
        implementation composeBom
        implementation("androidx.activity:activity-compose:1.9.0")
        implementation("androidx.compose.ui:ui")
        implementation("androidx.compose.material3:material3")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
